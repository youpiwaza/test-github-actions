name: Bun install
description: Set up Bun, restore the package cache, and install my-project dependencies

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.2.21

    - name: Cache Bun packages
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-1.2.21-${{ hashFiles('my-project/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-1.2.21-

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash
      working-directory: my-project
