name: Sync main into dev

# After main moves, open (or reuse) a sync-main PR into dev and queue auto-merge.
# Uses PROMOTE_TOKEN so this run is allowed to start after a merge into main.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN }}

      - name: Merge main onto sync-main and queue auto-merge
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "Missing PROMOTE_TOKEN secret."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev

          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "dev already contains main."
            exit 0
          fi

          git checkout -B sync-main origin/dev
          git merge origin/main
          git push --force-with-lease origin sync-main

          existing="$(gh pr list --repo "$REPO" --base dev --head sync-main --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            url="$(gh pr view "$existing" --repo "$REPO" --json url --jq .url)"
            echo "Reusing $url"
          else
            url="$(gh pr create --repo "$REPO" --base dev --head sync-main --title "Sync main into dev" --body "Opened after main was updated.")"
            echo "Opened $url"
          fi

          set +e
          out="$(gh pr merge --auto --squash "$url" 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          echo "$out" | grep -qi 'already' && exit 0
          exit "$code"
