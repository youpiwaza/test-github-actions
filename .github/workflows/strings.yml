name: Strings

# Called from _ci.yml, which owns when this job runs.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-project
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Bun install
        uses: ./.github/actions/bun-install

      - name: Run strings tests
        run: bun test is-string-lower-than-10-chars.test.ts is-string-greater-than-10-chars.test.ts
