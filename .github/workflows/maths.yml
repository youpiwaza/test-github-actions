name: Maths

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-project
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.2.21-${{ hashFiles('my-project/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.2.21-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run maths tests
        run: bun test addition.test.ts multiplication.test.ts division.test.ts
