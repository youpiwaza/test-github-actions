name: 1 All tests - CI

# Tests on every push, on any branch (feat-*, hfix-*, and future names).
# Pre-merge run: pull requests into dev or main only, so those two stay gated.
# Markdown-only diffs skip install/maths/strings, but this workflow still runs
# so the required `gate` check exists (workflow-level paths-ignore would block merges).
on:
  push:
  pull_request:
    branches:
      - main
      - dev
  # Permet de déclencher le workflow manuellement
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        name: Skip tests when only markdown changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          only_md=false

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            only_md=false
          elif [ "$EVENT_NAME" = pull_request ]; then
            git fetch origin "$BASE_SHA" "$HEAD_SHA"
            files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            only_md=true
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            only_md=false
          else
            # before is the previous branch tip. A rebase or force-push drops it
            # from the checkout, so fall back to the commit that was just pushed.
            from=""
            if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              from="$BEFORE"
            elif git rev-parse --verify "${SHA}^" >/dev/null 2>&1; then
              echo "Previous tip $BEFORE is not in this checkout; comparing ${SHA}^"
              from="${SHA}^"
            fi
            if [ -n "$from" ]; then
              files="$(git diff --name-only "$from" "$SHA")"
              only_md=true
            fi
          fi

          if [ "$only_md" = true ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                *.md) ;;
                *) only_md=false; break ;;
              esac
            done <<< "${files:-}"
          fi

          if [ "$only_md" = true ]; then
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          fi

  install:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    uses: ./.github/workflows/_install.yml

  maths:
    needs: [changes, install]
    if: needs.changes.outputs.run_tests == 'true'
    uses: ./.github/workflows/maths.yml

  strings:
    needs: [changes, install]
    if: needs.changes.outputs.run_tests == 'true'
    uses: ./.github/workflows/strings.yml

  # Pull requests only: allowed source branch, then rebase the target first.
  # feat-* or sync-main -> dev ; dev or hfix-* -> main. Still runs on markdown-only PRs.
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce gitflow
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          case "$BASE_REF" in
            dev)
              case "$HEAD_REF" in
                feat-*|sync-main) ;;
                *)
                  echo "PRs into dev must come from feat-* or sync-main (got $HEAD_REF)."
                  exit 1
                  ;;
              esac
              ;;
            main)
              case "$HEAD_REF" in
                dev|hfix-*) ;;
                *)
                  echo "PRs into main must come from dev or hfix-* (got $HEAD_REF)."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unexpected PR target $BASE_REF."
              exit 1
              ;;
          esac

          git fetch origin "$BASE_SHA" "$HEAD_SHA"
          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "Rebase $HEAD_REF onto $BASE_REF first: $BASE_REF is not an ancestor of $HEAD_REF."
            exit 1
          fi

  # Single required check for the dev/main rulesets.
  # On push, guard is skipped; maths and strings still have to pass when tests run.
  gate:
    name: gate
    needs: [changes, maths, strings, guard]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require tests and PR flow
        run: |
          set -euo pipefail
          test "${{ needs.changes.result }}" = success
          if [ "${{ needs.changes.outputs.run_tests }}" != "true" ]; then
            if [ "${{ github.event_name }}" = pull_request ]; then
              test "${{ needs.guard.result }}" = success
            fi
            exit 0
          fi
          test "${{ needs.maths.result }}" = success
          test "${{ needs.strings.result }}" = success
          if [ "${{ github.event_name }}" = pull_request ]; then
            test "${{ needs.guard.result }}" = success
          fi
